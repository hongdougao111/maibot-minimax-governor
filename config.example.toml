# ============================================================
# 本文件由 [plugin] 与 [minimax_governor] 两个配置节组成
# [plugin] 节为 MaiBot 插件系统要求的基础信息，请勿删除
# ============================================================

[plugin]
name = "MiniMax 开支管家"
version = "1.2.0"
config_version = "1.0.0"
enabled = true

[minimax_governor]
# ---- MiniMax 账户信息（必填）----
# 开放平台 https://platform.minimaxi.com → 套餐详情
# Token Plan / M Plan 用户填 sk-cp- 开头的套餐订阅 Key
# 注意：密钥两端的英文双引号必须保留！
api_key = "把这里改成你的密钥"
# 账户基本信息页面可见的 GroupId（找不到可填 0，仅影响余量显示）
group_id = "0"

# ---- 查询间隔 ----
# 每 N 分钟查询一次套餐余量（最小 5）
check_interval_minutes = 30

# ---- 发言预算 ----
# 默认每小时回复软上限（未单独设置预算的群使用此值）
# 参考：每次回复约消耗 1~3 万 token，请按套餐额度估算
default_reply_budget_per_hour = 40
# 分群独立预算：格式为文本，群号=每小时回复上限，多个用英文逗号分隔
# group_budgets = "123456789=60,987654321=20"
group_budgets = ""
# 硬上限 = 软上限 × 此倍数
hard_multiplier = 1.5

# ---- 策略 ----
# 初始策略：conservative（保守）/ balanced（均衡）/ aggressive（激进）
strategy = "balanced"

# ---- 套餐余量保护 ----
# 余量百分比低于此值时强制限流并提醒
low_percent = 20

# ---- 推送 ----
# 告急提醒与每日消费日报推送目标，格式如 "qq:管理员QQ:private"
# 留空则只记录日志不推送
notify_stream_id = "qq:1960136993:private"

# ---- 每日消费日报 ----
# 每天几点推送（0-23）
daily_report_hour = 21
