[minimax_governor]
# ---- MiniMax 账户信息（必填）----
# 开放平台 https://platform.minimaxi.com → 账户管理
# Token Plan 用户填 sk-sp- 开头的套餐专属 Key
api_key = ""
# 账户管理页面可见的 GroupId
group_id = ""

# ---- 查询间隔 ----
# 每 N 分钟查询一次套餐余量（最小 5）
check_interval_minutes = 30

# ---- 管理员 ----
# 只有这个 QQ 能使用 /省流开 /省流关 /策略 系列命令
admin_qq = "10000"

# ---- 发言预算 ----
# 默认每小时回复软上限（未单独设置预算的聊天使用此值）
# 参考：每次回复约消耗 1~3 万 token，请按套餐额度估算
default_reply_budget_per_hour = 40
# 分群独立预算：键为群号，未列出的群使用默认预算
# group_budgets = { "123456789" = 60, "987654321" = 20 }
group_budgets = {}
# 硬上限 = 软上限 × 此倍数
hard_multiplier = 1.5

# ---- 策略 ----
# 初始策略：conservative（保守）/ balanced（均衡）/ aggressive（激进）
# 运行中可用命令切换：/策略保守 /策略均衡 /策略激进
strategy = "balanced"

# ---- 套餐余量保护 ----
# 余量百分比低于此值时强制限流并提醒
low_percent = 20

# ---- 提醒 ----
# 余量告急与限流事件推送目标，格式如 "qq:管理员QQ:private"
# 留空则只记录日志不推送
notify_stream_id = ""
